    <!-- Apply saved theme before first paint to avoid a flash of dark mode.
         No saved preference => no class => dark default (matches ThemeProvider). -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("viddix-theme") === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>
